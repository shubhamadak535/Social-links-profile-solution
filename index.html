<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social links profile</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <article class="card">
      <header>
        <img class="profile-pic" src="assets/images/avatar-jessica.jpeg" alt="">
        <h1 class="username">Jessica Randall</h1>
        <p class="address">London, United Kingdom</p>
      </header>
      <p class="description">"Front-end developer and avid reader."</p>
      <nav>
        <ul>
          <li><a class="btn" href="#">GitHub</a></li>
          <li><a class="btn" href="#">Frontend Mentor</a></li>
          <li><a class="btn" href="#">LinkedIn</a></li>
          <li><a class="btn" href="#">Twitter</a></li>
          <li><a class="btn" href="#">Instagram</a></li>
        </ul>
      </nav>
    </article>
  </main>
</body>
</html>
